          Guten Tag,

          wir unterstützen Betriebe bei der Suche nach Erntehelfern aus
          Polen – aktuell verfügbar für Kürbis, Äpfel, Weintrauben und
          Kartoffeln. Bei Interesse gerne melden.

          Freundliche Grüße
          Patrycja, o1jobs
          +49 160 6328144 · www.o1jobs.de

