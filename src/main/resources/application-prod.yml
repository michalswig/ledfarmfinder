      - '"GbR" Erdbeerhof Harz Adresse'
      - '"Inhaber" Apfelhof Wittenberg Telefon'
      - '"GbR" Kürbisbauernhof Mansfeld-Südharz Kontakt'
      - '"Inhaber" Kartoffelhof Stendal Adresse'
      - '"GbR" Zwiebelhof Jerichower Land Telefon'
      - '"Inhaber" Pflaumenanbau Börde Kontakt'

      # === MECKLENBURG-VORPOMMERN — lato/jesień ===
      - '"Inhaber" Erdbeerhof Rostock Land Kontakt'
      - '"GbR" Apfelhof Nordwestmecklenburg Adresse'
