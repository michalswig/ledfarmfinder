    first-email-body-template: |
      Guten Tag,
      
      ich melde mich kurz bei Ihnen.
      
      Ich habe aktuell Kontakt zu mehreren Arbeitskräften aus Polen,
      die in den nächsten Wochen verfügbar sind (u. a. Äpfel, Weintrauben, Kartoffeln).
      Viele haben bereits Erfahrung in Deutschland – wir selbst arbeiten seit über 6 Jahren mit landwirtschaftlichen Betrieben zusammen.
      
      Falls das für Sie aktuell oder in den nächsten Wochen interessant ist,
      geben Sie mir gerne kurz Bescheid.
      
      Viele Grüße
      Patrycja
      o1jobs
      +49 160 6328144

    follow-up-subject: ${OUTREACH_FOLLOWUP_SUBJECT:Erntehelfer verfügbar – kurze Frage}

    follow-up-min-days-since-last-email: ${OUTREACH_FOLLOWUP_MIN_DAYS:60}

    follow-up-email-body-template: |
      Guten Tag,
      
      haben Sie zur Ernte noch Bedarf an Unterstützung? Wir vermitteln
      seit einigen Jahren Erntehelfer aus Polen an Betriebe wie Ihren.
      
      Kurze Rückmeldung genügt – gerne auch per Telefon.
      
      Viele Grüße
      Patrycja Swigost, o1jobs
      +49 160 6328144 · www.o1jobs.de
      
      Falls Sie keine weiteren Nachrichten erhalten möchten: {{UNSUBSCRIBE_URL}}

